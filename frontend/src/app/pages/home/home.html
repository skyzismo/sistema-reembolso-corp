<main class="page">
  <section class="welcome">

  </section>
  <section class="cards">
    <a class="feature-card" routerLink="/formulario"><span class="feature-icon">＋</span><h2>Nova despesa</h2><p>Registre uma despesa para solicitar reembolso.</p><span class="card-link">Acessar formulário →</span></a>

</main>
